# Default configuration for the experimental pipeline.
# Paths are relative to the repository root.

seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  legacy_dir: data/legacy       # optional, local only (not redistributed)
  reports_dir: reports

zenodo:
  api_url: https://zenodo.org/api
  # Jureczko records on Zenodo list the creator as "Marian Jureckzo" (sic);
  # both spellings are searched.
  creator_names: ["Jureczko", "Jureckzo"]
  timeout_seconds: 60
  max_retries: 3

# GitHub mirror of the PROMISE repository, used ONLY for releases absent from Zenodo.
# The commit is pinned; file paths are resolved from the repository tree at that
# commit and every file is verified against its git blob SHA-1.
github_mirror:
  repository: hjx-zhans/promise-backup
  commit: 1e8fd48cbd5275dd57409f3917de4c8ae9e15add
  directory: bug-data
  api_url: https://api.github.com
  raw_url: https://raw.githubusercontent.com
  # Releases taken from the mirror and stored in data/raw/.
  releases:
    ant: ["1.3", "1.4", "1.5", "1.6"]
  # Mirror releases compared row by row with Zenodo to show the mirror is faithful
  # (not stored).
  verify_against_zenodo:
    ant: ["1.7"]

# Projects and the releases we expect to find. The downloader uses whatever
# releases the Zenodo records actually contain and reports any differences.
projects:
  ant: ["1.3", "1.4", "1.5", "1.6", "1.7"]
  camel: ["1.0", "1.2", "1.4", "1.6"]
  ivy: ["1.1", "1.4", "2.0"]
  jedit: ["3.2", "4.0", "4.1", "4.2", "4.3"]
  log4j: ["1.0", "1.1", "1.2"]
  lucene: ["2.0", "2.2", "2.4"]
  poi: ["1.5", "2.0", "2.5", "3.0"]
  synapse: ["1.0", "1.1", "1.2"]
  velocity: ["1.4", "1.5", "1.6"]
  xalan: ["2.4", "2.5", "2.6", "2.7"]
  xerces: ["init", "1.2", "1.3", "1.4"]

audit:
  min_defective_ratio: 0.05
  max_defective_ratio: 0.75
  min_releases: 3
