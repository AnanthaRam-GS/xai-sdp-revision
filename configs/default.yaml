# Default configuration for the experimental pipeline.
# Paths are relative to the repository root.

seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  legacy_dir: data/legacy       # optional, local only (not redistributed)
  reports_dir: reports
  results_dir: results           # experiment outputs (git-ignored)

zenodo:
  api_url: https://zenodo.org/api
  # Jureczko records on Zenodo list the creator as "Marian Jureckzo" (sic);
  # both spellings are searched.
  creator_names: ["Jureczko", "Jureckzo"]
  timeout_seconds: 60
  max_retries: 3

# GitHub mirror of the PROMISE repository, used ONLY for releases absent from Zenodo.
# The commit is pinned; file paths are resolved from the repository tree at that
# commit and every file is verified against its git blob SHA-1.
github_mirror:
  repository: hjx-zhans/promise-backup
  commit: 1e8fd48cbd5275dd57409f3917de4c8ae9e15add
  directory: bug-data
  api_url: https://api.github.com
  raw_url: https://raw.githubusercontent.com
  # Releases taken from the mirror and stored in data/raw/.
  releases:
    ant: ["1.3", "1.4", "1.5", "1.6"]
  # Mirror releases compared row by row with Zenodo to show the mirror is faithful
  # (not stored).
  verify_against_zenodo:
    ant: ["1.7"]

# Projects and their releases, listed in CHRONOLOGICAL order. This order is used
# explicitly everywhere (time-aware splits, release pairs); versions are never
# string-sorted. The downloader reports any difference from this list.
projects:
  ant: ["1.3", "1.4", "1.5", "1.6", "1.7"]
  camel: ["1.0", "1.2", "1.4", "1.6"]
  ivy: ["1.1", "1.4", "2.0"]
  jedit: ["3.2", "4.0", "4.1", "4.2", "4.3"]
  log4j: ["1.0", "1.1", "1.2"]
  lucene: ["2.0", "2.2", "2.4"]
  poi: ["1.5", "2.0", "2.5", "3.0"]
  synapse: ["1.0", "1.1", "1.2"]
  velocity: ["1.4", "1.5", "1.6"]
  xalan: ["2.4", "2.5", "2.6", "2.7"]
  xerces: ["init", "1.2", "1.3", "1.4"]

# Study inclusion rule (also used for the flags in the data audit):
# 1. exclude releases whose defective ratio after cleaning is < min or > max;
# 2. keep a project only if it has >= min_releases remaining releases.
study:
  min_defective_ratio: 0.05
  max_defective_ratio: 0.75
  min_releases: 3

# Evaluation framework (step 2).
evaluation:
  # Time-aware protocol: "consecutive" (train = release n) or "cumulative"
  # (train = all included releases <= n); the test set is always release n+1.
  time_aware_variant: consecutive
  within_release:
    n_splits: 5
    n_repeats: 10
  # Stratified hold-out inside every training set (early stopping, threshold
  # tuning, calibration checks). The test set is never used for fitting or tuning.
  validation_size: 0.2
  preprocessing: standard        # none | standard | log_standard
  effort:
    recall_at_loc: 0.20          # Recall@20%LOC
    necm_cost_ratio: 15          # NECM_15
  bootstrap:
    n_resamples: 2000
    confidence: 0.95
